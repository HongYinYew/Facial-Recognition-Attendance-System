{% extends "layout.html" %}
{% block content %}

<div class="row">
    <div class="col-12 d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">{{ event.name }}</h2>
            <p class="text-muted mb-0"><i class="fa-solid fa-location-dot"></i> {{ event.venue }} | <i class="fa-regular fa-clock"></i> {{ event.start_time.strftime('%H:%M') }}</p>
        </div>
        <div class="badge bg-success bg-opacity-10 text-success p-2 border border-success">
            <i class="fa-solid fa-wifi"></i> Live Sync Active
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header bg-white">
        <input type="text" id="attSearch" class="form-control" placeholder="Search for member...">
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle" id="attTable">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Name</th>
                        <th>English Name</th>
                        <th class="text-center">Attend?</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td class="px-4">{{ u.name }}</td>
                        <td>{{ u.english_name }}</td>
                        <td class="text-center">
                            <div class="form-check d-inline-block">
                                <input class="form-check-input att-check p-2" 
                                       type="checkbox" 
                                       data-uid="{{ u.id }}" 
                                       id="chk_{{ u.id }}"
                                       style="cursor: pointer; border: 2px solid #dee2e6;"
                                       {% if u.id in attended_ids %}checked{% endif %}>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const eventId = "{{ event.id }}";
    
    // 1. Search Logic
    document.getElementById('attSearch').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const rows = document.querySelectorAll('#attTable tbody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(filter) ? '' : 'none';
        });
    });

    // 2. WebSocket Connection
    const protocol = window.location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${protocol}://${window.location.host}/ws/attendance/${eventId}`;
    const socket = new WebSocket(wsUrl);

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.status === 'marked') {
            const checkbox = document.querySelector(`.att-check[data-uid="${data.user_id}"]`);
            if (checkbox) {
                checkbox.checked = true;
                checkbox.closest('tr').style.backgroundColor = "#d1e7dd";
                setTimeout(() => checkbox.closest('tr').style.backgroundColor = "", 1000);
            }
        }
    };

    // 3. Handle Manual Clicks
    document.querySelectorAll('.att-check').forEach(box => {
        box.addEventListener('change', async function() {
            const userId = this.dataset.uid;
            const action = this.checked ? 'mark' : 'unmark';
            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('event_id', eventId);
            formData.append('action', action);
            try { await fetch('/api/mark_manual', { method: 'POST', body: formData }); } 
            catch(e) { console.error(e); alert("Sync Failed"); }
        });
    });
</script>
{% endblock %}
