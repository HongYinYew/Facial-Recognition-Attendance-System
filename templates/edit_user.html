{% extends "layout.html" %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header"><h4>Edit User: {{ user.english_name }}</h4></div>
        <div class="card-body">
            <form action="/api/edit_user/{{ user.id }}" method="post">
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="name" value="{{ user.name }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>English Name</label>
                    <input type="text" name="english_name" value="{{ user.english_name }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ user.phone }}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Update User</button>
                <a href="/admin" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
