
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fa-solid fa-id-card-clip me-2"></i>Enroll Facial Recognition</h4>
                <a href="/admin" class="btn btn-sm btn-secondary">Back</a>
            </div>
            <div class="card-body">
                <div class="row">
                    
                    <!-- Step 1: Select User -->
                    <div class="col-md-5 border-end">
                        <h5 class="text-muted mb-3">1. Select User</h5>
                        
                        <!-- Search Box -->
                        <input type="text" id="memberSearch" class="form-control mb-2" placeholder="Type name to filter list...">
                        
                        <div class="mb-3">
                            <select id="userSelect" class="form-select" size="12">
                                {% for u in users %}
                                <option value="{{ u.id }}">
                                    {{ u.name }} ({{ u.english_name }}) 
                                    — {{ u.faces|length }} enrolled
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Step 2: Capture Face -->
                    <div class="col-md-7">
                        <h5 class="text-muted mb-3">2. Add Face Angle</h5>
                        
                        <div class="input-group mb-2">
                            <label class="input-group-text"><i class="fa-solid fa-camera"></i></label>
                            <select id="cameraSelect" class="form-select"></select>
                        </div>

                        <div class="video-wrapper mb-2" style="position: relative; background: #000; border-radius: 8px; overflow: hidden;">
                            <video id="video" autoplay playsinline style="width: 100%; display: block;"></video>
                            <canvas id="canvas" class="d-none"></canvas>
                        </div>

                        <button id="captureUpdateBtn" class="btn btn-primary w-100" disabled>
                            Select a User first
                        </button>

                        <div id="msgArea" class="mt-3"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const cameraSelect = document.getElementById('cameraSelect');
    const userSelect = document.getElementById('userSelect');
    const btn = document.getElementById('captureUpdateBtn');
    const msgArea = document.getElementById('msgArea');

    // Search Filter Logic
    document.getElementById('memberSearch').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const options = userSelect.getElementsByTagName('option');
        
        for (let i = 0; i < options.length; i++) {
            const text = options[i].text.toLowerCase();
            options[i].style.display = text.includes(filter) ? '' : 'none';
        }
    });

    // Enable button logic
    userSelect.addEventListener('change', () => {
        btn.disabled = false;
        btn.innerText = "Stack New Face for: " + userSelect.options[userSelect.selectedIndex].text.split('—')[0];
    });

    // Camera Logic
    async function getCameras() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            cameraSelect.innerHTML = "";
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                cameraSelect.appendChild(option);
            });
            if (videoDevices.length > 0) startStream(videoDevices[0].deviceId);
        } catch(err) { console.error(err); }
    }

    async function startStream(deviceId) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } });
        video.srcObject = stream;
    }
    cameraSelect.addEventListener('change', (e) => startStream(e.target.value));
    getCameras();

    // Capture & Stack
    btn.addEventListener('click', () => {
        if (!video.videoWidth) return;

        // UI Feedback: Disable button immediately
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        msgArea.innerHTML = '<div class="alert alert-info">Analyzing face... please wait.</div>';

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('user_id', userSelect.value);
            formData.append('image_file', blob, 'face_update.jpg');

            try {
                const res = await fetch('/api/update_face', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.status === 'success') {
                    msgArea.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    showToast("Face Enrolled Successfully!", "success");
                    btn.innerText = "Success! Reloading...";
                    setTimeout(() => location.reload(), 1500);
                } else {
                    msgArea.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                    showToast(data.message, "danger");
                    // Re-enable button on error
                    btn.disabled = false;
                    btn.innerText = "Try Again";
                }
            } catch (e) {
                msgArea.innerHTML = `<div class="alert alert-danger">Network/Server Error</div>`;
                showToast("Network Error", "danger");
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        }, 'image/jpeg', 0.8);
    });
</script>
{% endblock %}
